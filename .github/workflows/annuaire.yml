name: Annuaire des radios
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths: ["outils/annuaire.py", ".github/workflows/annuaire.yml"]
permissions:
  contents: write
jobs:
  annuaire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python outils/annuaire.py
      - run: |
          git config user.name "Écho (robot)"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/radios.json
          git diff --cached --quiet || (git commit -m "Annuaire des radios mis à jour" && git push)
